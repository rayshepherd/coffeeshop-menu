<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DJ LAB Cafe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --coral: #FF6357;
    --cream: #F7F0E8;
    --ink: #1a1410;
    --ink-mid: #3d3530;
    --ink-light: #7a6e66;
    --coral-dark: #cc3d31;
    --coral-pale: rgba(255,99,87,0.08);
    --coral-border: rgba(255,99,87,0.2);
    --cream-dark: #ede5d8;
    --divider: rgba(26,20,16,0.1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    font-family: 'DM Mono', monospace;
    background: var(--cream);
    color: var(--ink);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    background: var(--coral);
    padding: 3rem 2rem 2.5rem;
    position: relative;
    overflow: hidden;
  }
  header::after {
    content: '';
    position: absolute;
    bottom: -1px; left: 0; right: 0;
    height: 6px;
    background: repeating-linear-gradient(
      90deg,
      var(--cream) 0px, var(--cream) 8px,
      var(--coral) 8px, var(--coral) 16px
    );
  }
  .header-inner {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .logo-svg-wrap {
    width: 100%;
    max-width: 420px;
  }
  .logo-svg-wrap svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .logo-cafe {
    font-family: 'DM Mono', monospace;
    font-size: clamp(0.85rem, 2vw, 1.05rem);
    font-weight: 400;
    letter-spacing: 0.4em;
    color: var(--cream);
    opacity: 0.8;
    margin-top: 0.35rem;
  }
  .header-tagline {
    font-size: 0.72rem;
    letter-spacing: 0.08em;
    color: rgba(247,240,232,0.6);
    margin-top: 1.2rem;
    text-transform: lowercase;
  }
  .header-tagline::before { content: '// '; }

  /* ── NAV ── */
  .nav-wrapper {
    background: var(--ink);
    position: sticky; top: 0; z-index: 100;
  }
  nav {
    display: flex; overflow-x: auto; scrollbar-width: none;
    max-width: 900px; margin: 0 auto; padding: 0 1.5rem;
  }
  nav::-webkit-scrollbar { display: none; }
  nav a {
    color: rgba(247,240,232,0.4);
    text-decoration: none;
    font-family: 'DM Mono', monospace;
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    text-transform: lowercase;
    padding: 0.85rem 1rem;
    white-space: nowrap;
    border-bottom: 2px solid transparent;
    transition: color 0.2s, border-color 0.2s;
    flex-shrink: 0;
  }
  nav a::before { content: '_'; color: var(--coral); opacity: 0; transition: opacity 0.2s; }
  nav a:hover::before, nav a.active::before { opacity: 1; }
  nav a:hover, nav a.active { color: var(--cream); border-bottom-color: var(--coral); }

  /* ── MAIN ── */
  main { max-width: 900px; margin: 0 auto; padding: 0 1.5rem 5rem; }

  /* ── SECTION ── */
  .menu-section { padding-top: 4rem; }
  .section-header {
    margin-bottom: 1.5rem;
    padding-bottom: 0.75rem;
    border-bottom: 2px solid var(--ink);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
  }
  .section-title {
    font-size: clamp(1.4rem, 3.5vw, 1.9rem);
    font-weight: 500;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .section-title::before {
    content: '_';
    color: var(--coral);
    margin-right: 0.1em;
  }
  .section-num {
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    color: var(--ink-light);
    flex-shrink: 0;
  }

  /* ── ITEMS ── */
  .items-list {
    display: flex;
    flex-direction: column;
    border: 1.5px solid var(--ink);
  }
  .item-card {
    padding: 1rem 1.25rem;
    border-bottom: 1px solid var(--divider);
    transition: background 0.15s;
  }
  .item-card:last-child { border-bottom: none; }
  .item-card:hover { background: var(--coral-pale); }

  .item-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
  }
  .item-name {
    font-size: 0.95rem;
    font-weight: 500;
    letter-spacing: 0.01em;
    color: var(--ink);
    flex: 1;
  }
  .item-dots {
    flex: 1;
    min-width: 20px;
    border-bottom: 1px dotted rgba(26,20,16,0.2);
    margin: 0 0.5rem;
    margin-bottom: 3px;
  }
  .item-price {
    font-size: 0.9rem;
    font-weight: 400;
    color: var(--coral-dark);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .item-desc {
    font-size: 0.72rem;
    color: var(--ink-light);
    line-height: 1.5;
    font-weight: 300;
    font-style: italic;
    margin-top: 0.25rem;
    letter-spacing: 0.01em;
  }
  .item-tag {
    display: inline-block;
    font-size: 0.6rem;
    letter-spacing: 0.15em;
    color: var(--coral-dark);
    border: 1px solid var(--coral-border);
    padding: 1px 5px;
    margin-top: 0.3rem;
  }

  /* ── PORTIONS ── */
  .portions-list {
    margin-top: 0.6rem;
    padding-top: 0.5rem;
    border-top: 1px dashed var(--coral-border);
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
  }
  .portion-row {
    display: flex;
    align-items: baseline;
    gap: 0;
  }
  .portion-name {
    font-size: 0.78rem;
    color: var(--ink-mid);
    font-weight: 300;
    letter-spacing: 0.02em;
    white-space: nowrap;
  }
  .portion-dots {
    flex: 1;
    border-bottom: 1px dotted rgba(26,20,16,0.15);
    margin: 0 0.4rem;
    margin-bottom: 3px;
    min-width: 16px;
  }
  .portion-price {
    font-size: 0.78rem;
    color: var(--coral-dark);
    font-weight: 400;
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* ── FOOTER ── */
  footer {
    border-top: 2px solid var(--ink);
    margin-top: 4rem;
    padding: 2rem 1.5rem 3rem;
    max-width: 900px;
    margin-left: auto;
    margin-right: auto;
  }
  .footer-inner {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }
  .footer-name {
    font-size: 1.1rem;
    font-weight: 500;
    letter-spacing: 0.05em;
    color: var(--ink);
  }
  .footer-name span { color: var(--coral); }
  .footer-update {
    font-size: 0.65rem;
    color: var(--ink-light);
    letter-spacing: 0.05em;
  }
  .footer-update::before { content: '// '; }

  .state-msg {
    text-align: center; padding: 4rem 2rem;
    color: var(--ink-light); font-size: 0.9rem;
    letter-spacing: 0.05em;
  }

  @media (max-width: 520px) {
    .section-num { display: none; }
    header { padding: 2rem 1.25rem 2rem; }
    main { padding: 0 1rem 4rem; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo-svg-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1888 376" aria-label="DJ LAB Café" role="img">
        <polygon fill="#F7F0E8" points="1778,2 1754,2 1754,14 1778,14 1778,62 1790,62 1790,14 1814,14 1814,2 1790,2"/>
        <polygon fill="#F7F0E8" points="1874,2 1856,38 1838,2 1826,2 1826,62 1838,62 1838,26 1850,50 1862,50 1874,26 1874,62 1886,62 1886,2"/>
        <path fill="#F7F0E8" d="M230,62v252c33.14,0,60-26.86,60-60V122C290,88.86,263.14,62,230,62z"/>
        <path fill="#F7F0E8" d="M62,62h168c0-33.14-26.86-60-60-60H32C15.43,2,2,15.43,2,32v312c0,16.57,13.43,30,30,30h138c33.14,0,60-26.86,60-60H62V62z"/>
        <path fill="#F7F0E8" d="M1214,2h-48c-33.14,0-60,26.86-60,60h168C1274,28.86,1247.14,2,1214,2z"/>
        <path fill="#F7F0E8" d="M1274,62v120h-168V62c-33.14,0-60,26.86-60,60v252h60V242h168v132h60V122C1334,88.86,1307.14,62,1274,62z"/>
        <path fill="#F7F0E8" d="M1646,2h-198c-16.57,0-30,13.43-30,30v312c0,16.57,13.43,30,30,30h30h168c33.14,0,60-26.86,60-60v-24c0-39.76-32.24-72-72-72v96h-156v-96h156v-60h-156V62h156v96c39.76,0,72-32.24,72-72V62C1706,28.86,1679.14,2,1646,2z"/>
        <path fill="#F7F0E8" d="M794,194V2h-60v342c0,16.57,13.43,30,30,30h222v-60H794V194z"/>
        <path fill="#F7F0E8" d="M326,374h132c33.14,0,60-26.86,60-60H326V374z"/>
        <path fill="#F7F0E8" d="M548,2H398v60h120v252c33.14,0,60-26.86,60-60V32C578,15.43,564.57,2,548,2z"/>
      </svg>
    </div>
    <div class="logo-cafe">CAFÉ</div>
    <p class="header-tagline" id="header-tagline">ask your server about allergens &amp; daily specials</p>
  </div>
</header>

<div class="nav-wrapper">
  <nav id="category-nav"></nav>
</div>

<main id="menu-main">
  <p class="state-msg" id="loading-msg">loading menu...</p>
</main>

<footer>
  <div class="footer-inner">
    <p class="footer-name">DJ <span>LAB</span> Café</p>
    <p class="footer-update" id="footer-update"></p>
  </div>
</footer>

<script>
(async () => {
  let data;
  try {
    const res = await fetch('menu.json?v=' + Date.now());
    if (!res.ok) throw new Error(res.status);
    data = await res.json();
  } catch (e) {
    document.getElementById('loading-msg').textContent = 'menu unavailable — please ask your server.';
    return;
  }

  if (data.updatedAt) {
    const d = new Date(data.updatedAt);
    document.getElementById('footer-update').textContent =
      'updated ' + d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
  }

  const currency = data.currency || '$';
  const nav  = document.getElementById('category-nav');
  const main = document.getElementById('menu-main');
  main.innerHTML = '';

  (data.categories || []).forEach((cat, idx) => {
    const catId = 'cat-' + idx;

    const a = document.createElement('a');
    a.href = '#' + catId;
    a.textContent = cat.name.toLowerCase();
    if (idx === 0) a.classList.add('active');
    nav.appendChild(a);

    const section = document.createElement('section');
    section.className = 'menu-section';
    section.id = catId;

    section.innerHTML = `
      <div class="section-header">
        <h2 class="section-title">${esc(cat.name.toLowerCase())}</h2>
        <span class="section-num">${String(idx + 1).padStart(2, '0')}</span>
      </div>
    `;

    const list = document.createElement('div');
    list.className = 'items-list';

    (cat.items || []).forEach(item => {
      const card = document.createElement('div');
      card.className = 'item-card';

      const hasPortions = item.portions && item.portions.length > 0;

      const priceHtml = !hasPortions
        ? `<div class="item-dots"></div><span class="item-price">${item.price > 0 ? currency + Number(item.price).toFixed(2) : 'ask server'}</span>`
        : '';

      const descHtml = item.description
        ? `<p class="item-desc">${esc(item.description)}</p>`
        : '';

      const tagHtml = item.tag
        ? `<span class="item-tag">${esc(item.tag)}</span>`
        : '';

      let portionsHtml = '';
      if (hasPortions) {
        const rows = item.portions.map(p => `
          <div class="portion-row">
            <span class="portion-name">${esc(p.name.toLowerCase())}</span>
            <div class="portion-dots"></div>
            <span class="portion-price">${p.price > 0 ? currency + Number(p.price).toFixed(2) : 'ask server'}</span>
          </div>
        `).join('');
        portionsHtml = `<div class="portions-list">${rows}</div>`;
      }

      card.innerHTML = `
        <div class="item-top">
          <span class="item-name">${esc(item.name.toLowerCase())}</span>
          ${priceHtml}
        </div>
        ${descHtml}
        ${portionsHtml}
        ${tagHtml}
      `;
      list.appendChild(card);
    });

    section.appendChild(list);
    main.appendChild(section);
  });

  // Active nav on scroll
  const sections = main.querySelectorAll('.menu-section');
  const navLinks  = nav.querySelectorAll('a');
  const observer  = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        navLinks.forEach(l => l.classList.remove('active'));
        const link = nav.querySelector(`a[href="#${entry.target.id}"]`);
        if (link) {
          link.classList.add('active');
          link.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        }
      }
    });
  }, { rootMargin: '-40% 0px -55% 0px' });
  sections.forEach(s => observer.observe(s));
})();

function esc(str) {
  return String(str || '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
