<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c;
    --gold-light: #e8d5a3;
    --gold-dark: #8a6820;
    --ink: #1a1612;
    --ink-mid: #3d3530;
    --ink-light: #6b6058;
    --cream: #faf8f4;
    --cream-dark: #f0ece3;
    --divider: rgba(201,168,76,0.25);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--ink);
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    background: var(--ink);
    color: var(--cream);
    text-align: center;
    padding: 3.5rem 1.5rem 3rem;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 0%, rgba(201,168,76,0.12) 0%, transparent 70%);
    pointer-events: none;
  }
  .header-ornament {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    margin-bottom: 1.2rem;
  }
  .header-ornament::before,
  .header-ornament::after {
    content: '';
    height: 1px;
    width: 60px;
    background: linear-gradient(to right, transparent, var(--gold));
  }
  .header-ornament::after {
    background: linear-gradient(to left, transparent, var(--gold));
  }
  .header-ornament span {
    color: var(--gold);
    font-size: 1.2rem;
  }
  header h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2.4rem, 6vw, 3.8rem);
    font-weight: 300;
    letter-spacing: 0.08em;
    color: var(--cream);
    margin-bottom: 0.5rem;
  }
  header h1 em {
    font-style: italic;
    color: var(--gold-light);
  }
  .header-sub {
    font-size: 0.78rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(250,248,244,0.45);
    margin-top: 1.2rem;
  }

  /* ── NAV TABS ── */
  .nav-wrapper {
    background: var(--ink);
    border-bottom: 1px solid rgba(201,168,76,0.2);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  nav {
    display: flex;
    overflow-x: auto;
    scrollbar-width: none;
    max-width: 900px;
    margin: 0 auto;
    padding: 0 1rem;
    gap: 0;
  }
  nav::-webkit-scrollbar { display: none; }
  nav a {
    color: rgba(250,248,244,0.5);
    text-decoration: none;
    font-size: 0.72rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 0.9rem 1.1rem;
    white-space: nowrap;
    border-bottom: 2px solid transparent;
    transition: color 0.2s, border-color 0.2s;
    flex-shrink: 0;
  }
  nav a:hover, nav a.active {
    color: var(--gold-light);
    border-bottom-color: var(--gold);
  }

  /* ── MAIN CONTENT ── */
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 1.25rem 5rem;
  }

  /* ── SECTION ── */
  .menu-section {
    padding-top: 3.5rem;
  }
  .section-header {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    margin-bottom: 2rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--divider);
  }
  .section-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(1.8rem, 4vw, 2.4rem);
    font-weight: 400;
    letter-spacing: 0.03em;
    color: var(--ink);
    white-space: nowrap;
  }
  .section-line {
    flex: 1;
    height: 1px;
    background: var(--divider);
  }
  .section-num {
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    color: var(--gold-dark);
    font-weight: 500;
    white-space: nowrap;
  }

  /* ── ITEM GRID ── */
  .items-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 1px;
    background: var(--divider);
    border: 1px solid var(--divider);
  }
  .item-card {
    background: var(--cream);
    padding: 1.4rem 1.5rem;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
    transition: background 0.18s;
  }
  .item-card:hover {
    background: var(--cream-dark);
  }
  .item-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1rem;
  }
  .item-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.15rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    line-height: 1.3;
    color: var(--ink);
    flex: 1;
  }
  .item-price {
    font-size: 0.95rem;
    font-weight: 500;
    color: var(--gold-dark);
    white-space: nowrap;
    letter-spacing: 0.02em;
    flex-shrink: 0;
  }
  .item-desc {
    font-size: 0.82rem;
    color: var(--ink-light);
    line-height: 1.55;
    font-weight: 300;
  }
  .item-tag {
    display: inline-block;
    font-size: 0.62rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #4a7c4e;
    border: 1px solid #4a7c4e;
    padding: 1px 6px;
    border-radius: 2px;
    margin-top: 0.2rem;
    width: fit-content;
  }

  /* ── FOOTER ── */
  footer {
    text-align: center;
    padding: 2rem 1rem 3rem;
    border-top: 1px solid var(--divider);
    margin-top: 3rem;
  }
  .footer-logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.2rem;
    font-weight: 300;
    letter-spacing: 0.15em;
    color: var(--ink-light);
    margin-bottom: 0.5rem;
  }
  .footer-update {
    font-size: 0.72rem;
    color: rgba(107,96,88,0.55);
    letter-spacing: 0.08em;
  }

  /* ── LOADING / ERROR ── */
  .state-msg {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--ink-light);
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.3rem;
    font-style: italic;
  }

  /* ── MOBILE ── */
  @media (max-width: 520px) {
    .items-grid { grid-template-columns: 1fr; }
    .section-num { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="header-ornament"><span>✦</span></div>
  <h1 id="restaurant-name">Our <em>Menu</em></h1>
  <p class="header-sub" id="header-tagline">Please ask your server about allergens &amp; daily specials</p>
</header>

<div class="nav-wrapper">
  <nav id="category-nav"></nav>
</div>

<main id="menu-main">
  <p class="state-msg" id="loading-msg">Loading menu…</p>
</main>

<footer>
  <p class="footer-logo" id="footer-name"></p>
  <p class="footer-update" id="footer-update"></p>
</footer>

<script>
(async () => {
  const MENU_URL = 'menu.json';

  let data;
  try {
    const res = await fetch(MENU_URL + '?v=' + Date.now());
    if (!res.ok) throw new Error(res.status);
    data = await res.json();
  } catch (e) {
    document.getElementById('loading-msg').textContent = 'Menu unavailable — please ask your server.';
    return;
  }

  // Update header
  const title = data.restaurant || 'Our Menu';
  document.title = title;
  document.getElementById('restaurant-name').innerHTML = formatTitle(title);
  document.getElementById('footer-name').textContent = title;

  if (data.updatedAt) {
    const d = new Date(data.updatedAt);
    document.getElementById('footer-update').textContent =
      'Menu updated ' + d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
  }

  const currency = data.currency || '$';
  const nav      = document.getElementById('category-nav');
  const main     = document.getElementById('menu-main');
  main.innerHTML  = '';

  const cats = data.categories || [];

  cats.forEach((cat, idx) => {
    // Nav link
    const catId = 'cat-' + idx;
    const a = document.createElement('a');
    a.href = '#' + catId;
    a.textContent = cat.name;
    if (idx === 0) a.classList.add('active');
    nav.appendChild(a);

    // Section
    const section = document.createElement('section');
    section.className = 'menu-section';
    section.id = catId;

    const hdr = document.createElement('div');
    hdr.className = 'section-header';
    hdr.innerHTML = `
      <h2 class="section-title">${esc(cat.name)}</h2>
      <div class="section-line"></div>
      <span class="section-num">${String(idx + 1).padStart(2, '0')}</span>
    `;
    section.appendChild(hdr);

    const grid = document.createElement('div');
    grid.className = 'items-grid';

    (cat.items || []).forEach(item => {
      const card = document.createElement('div');
      card.className = 'item-card';

      const priceStr = item.price > 0
        ? currency + Number(item.price).toFixed(2)
        : 'Ask server';

      const tagHtml = item.tag
        ? `<span class="item-tag">${esc(item.tag)}</span>`
        : '';

      const descHtml = item.description
        ? `<p class="item-desc">${esc(item.description)}</p>`
        : '';

      card.innerHTML = `
        <div class="item-top">
          <span class="item-name">${esc(item.name)}</span>
          <span class="item-price">${priceStr}</span>
        </div>
        ${descHtml}
        ${tagHtml}
      `;
      grid.appendChild(card);
    });

    section.appendChild(grid);
    main.appendChild(section);
  });

  // Active nav highlight on scroll
  const sections = main.querySelectorAll('.menu-section');
  const navLinks  = nav.querySelectorAll('a');
  const observer  = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        navLinks.forEach(l => l.classList.remove('active'));
        const link = nav.querySelector(`a[href="#${entry.target.id}"]`);
        if (link) {
          link.classList.add('active');
          link.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
        }
      }
    });
  }, { rootMargin: '-40% 0px -55% 0px' });
  sections.forEach(s => observer.observe(s));
})();

function esc(str) {
  return String(str || '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function formatTitle(name) {
  const words = name.trim().split(' ');
  if (words.length === 1) return name + ' <em>Menu</em>';
  const last = words.pop();
  return words.join(' ') + ' <em>' + last + '</em>';
}
</script>
</body>
</html>
